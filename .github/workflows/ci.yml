# meru CI: format, lint and tests (unit + end to end over a loopback socket).
#
# meru builds against a sibling kshana-pro checkout (path dependencies, see Cargo.toml), so
# the job checks out both repositories side by side. kshana-pro is public (since 20 Nov 2026),
# so no token is needed.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meru-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # GitHub-hosted (public repository since 20 Nov 2026). No self-hosted runner: a fork pull
    # request must never run on our machines.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: meru
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashfordeOU/kshana-pro
          path: kshana-pro
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain is the `toolchain` input below
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: meru
      - name: Format
        working-directory: meru
        run: cargo fmt --check
      - name: Lint
        working-directory: meru
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: meru
        run: cargo test
