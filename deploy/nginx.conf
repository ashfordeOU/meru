# nginx in front of meru: TLS, per-address rate limits, body and time limits. meru does its
# own per-licence limits; this layer stops floods before they reach it.
#
# Replace verdict.example.com and the certificate paths. Certificates: certbot or the
# cloud's certificate manager.

limit_req_zone  $binary_remote_addr zone=meru_req:10m  rate=30r/m;
limit_conn_zone $binary_remote_addr zone=meru_conn:10m;

server {
    listen 80;
    server_name verdict.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name verdict.example.com;

    ssl_certificate     /etc/letsencrypt/live/verdict.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verdict.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout   15s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     5s;

    location = /health {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /verdict/ {
        limit_req  zone=meru_req burst=10 nodelay;
        limit_conn meru_conn 4;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The client address for meru's per-address limit (MERU_TRUST_PROXY=1).
        proxy_set_header X-Real-IP $remote_addr;
        # meru frames by Content-Length; nginx buffers the body and sends it that way.
        proxy_request_buffering on;
        proxy_read_timeout 620s;
    }

    location / { return 404; }
}
